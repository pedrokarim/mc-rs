[workspace]
resolver = "2"
members = [
    "old_crates/mc-rs-raknet",
    "old_crates/mc-rs-crypto",
    "old_crates/mc-rs-proto",
    "old_crates/mc-rs-nbt",
    "old_crates/mc-rs-world",
    "old_crates/mc-rs-game",
    "old_crates/mc-rs-command",
    "old_crates/mc-rs-plugin-api",
    "old_crates/mc-rs-plugin-lua",
    "old_crates/mc-rs-plugin-wasm",
    "old_crates/mc-rs-behavior-pack",
    "old_crates/mc-rs-server",
]
exclude = [
    "crates",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util", "io-std"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
flate2 = "1"
snap = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
cfb8 = "0.8"
rusty-leveldb = "3"
toml = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
wasmtime = "29"
