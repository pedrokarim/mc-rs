[workspace]
resolver = "2"
members = [
    "crates/mc-rs-proto",
    "crates/mc-rs-raknet",
    "crates/mc-rs-crypto",
    "crates/mc-rs-command",
    "crates/mc-rs-nbt",
    "crates/mc-rs-server",
    "benchmark",
]
exclude = [
    "old_crates",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util", "io-std"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
flate2 = "1"
snap = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
