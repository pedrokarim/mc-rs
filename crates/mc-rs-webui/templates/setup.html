{% extends "base.html" %}
{% block title %}Setup initial — mc-rs admin{% endblock %}
{% block body %}
<main class="auth-page">
  <h1><i data-lucide="shield-plus" class="icon-lg"></i> Configuration initiale</h1>
  <p class="note">Aucun administrateur n'existe encore. Crée le premier compte pour débloquer le panneau.</p>
  {% if let Some(err) = error %}
  <p class="error"><i data-lucide="alert-circle"></i><span>{{ err }}</span></p>
  {% endif %}
  <form method="post" action="/setup" class="auth-form">
    <label>Nom d'utilisateur
      <input type="text" name="username" required minlength="3" maxlength="32" autocomplete="username">
    </label>
    <label>Mot de passe (8 chars min)
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>Confirmation
      <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit"><i data-lucide="user-plus"></i><span>Créer l'administrateur</span></button>
  </form>
</main>
{% endblock %}
