<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}mc-rs admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/uplot.min.css">
    <script src="/static/lucide.min.js"></script>
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/alpine.min.js" defer></script>
    <script src="/static/uplot.min.js"></script>
</head>
<body>
{% block body %}{% endblock %}

<script>
// Hydrate les icônes Lucide.
//
// ATTENTION : Lucide remplace les <i data-lucide="X"> par des <svg>. On ne
// doit appeler createIcons() QUE quand de nouveaux <i data-lucide> sont
// susceptibles d'exister — jamais en réponse à chaque mutation DOM (Alpine
// update le snapshot à 20 Hz → 20× scan/s + feedback observer = CPU burn).
function hydrateIcons() {
  if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
}
document.addEventListener('DOMContentLoaded', hydrateIcons);
document.addEventListener('htmx:afterSwap', hydrateIcons);
// Hydrate aussi juste après qu'Alpine ait rendu ses templates initiaux.
document.addEventListener('alpine:initialized', () => setTimeout(hydrateIcons, 0));
// Expose pour appel manuel depuis un composant Alpine qui aurait injecté des icônes.
window.hydrateIcons = hydrateIcons;
</script>
</body>
</html>
